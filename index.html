<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calc">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="out" id="out">0</div>
  </div>

  <div class="keys" id="keys">
    <button data-act="clear" class="fn">C</button>
    <button data-act="back" class="fn" aria-label="Backspace">⌫</button>
    <button data-act="percent" class="fn">%</button>
    <button data-op="/" class="op" aria-label="Divide">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button data-op="*" class="op" aria-label="Multiply">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button data-op="-" class="op" aria-label="Subtract">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button data-op="+" class="op" aria-label="Add">+</button>

    <button data-act="negate" aria-label="Plus or minus">±</button>
    <button data-num="0">0</button>
    <button data-act="dot">.</button>
    <button data-act="equals" class="eq" aria-label="Equals">=</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
